  <title>WildCard Labs // Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07050d;
      --pink: #ff4fd8;
      --blue: #59b8ff;
      --purple: #9b5cff;
      --text: #fff8ff;
      --muted: #cfc4df;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 18%, rgba(155, 92, 255, 0.18), transparent 28rem),
        radial-gradient(circle at 80% 22%, rgba(89, 184, 255, 0.16), transparent 30rem),
        radial-gradient(circle at 50% 78%, rgba(255, 79, 216, 0.14), transparent 32rem),
        linear-gradient(180deg, #05030a 0%, var(--bg) 48%, #030207 100%);
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -40vmax;
      pointer-events: none;
      z-index: -1;
    }

    body::before {
      background:
        conic-gradient(
          from 0deg,
          transparent 0 18%,
          rgba(155, 92, 255, 0.08) 24%,
          transparent 34% 52%,
          rgba(89, 184, 255, 0.07) 61%,
          transparent 72% 84%,
          rgba(255, 79, 216, 0.07) 92%,
          transparent
        );
      animation: ambient-spin 24s linear infinite;
      filter: blur(24px);
    }

    body::after {
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 0 32%, transparent 74%);
    }

    .stage {
      width: min(92vw, 1050px);
      min-height: min(78svh, 760px);
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 64px);
      text-align: center;
      position: relative;
      perspective: 1100px;
    }

    .orb {
      position: absolute;
      width: min(72vw, 620px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(155, 92, 255, 0.25);
      box-shadow:
        0 0 80px rgba(155, 92, 255, 0.20),
        inset 0 0 90px rgba(89, 184, 255, 0.08);
      background:
        radial-gradient(circle at 42% 36%, rgba(255,255,255,0.08), transparent 12%),
        radial-gradient(circle at center, rgba(15, 8, 28, 0.92) 0 38%, rgba(6,4,12,0.78) 66%, transparent 72%);
      animation: breathe 5s ease-in-out infinite;
    }

    .content {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.68rem, 1.4vw, 0.9rem);
      font-weight: 800;
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }

    .logo {
      margin: 0;
      font-size: clamp(2rem, 7vw, 5.8rem);
      line-height: 0.9;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--purple), var(--blue), var(--pink), var(--purple));
      background-size: 260% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(155, 92, 255, 0.42));
      animation: shimmer 5.5s linear infinite;
    }

    .rotator {
      position: relative;
      width: min(88vw, 840px);
      height: clamp(88px, 12vw, 128px);
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
    }

    .rotating-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      font-size: clamp(2.3rem, 9vw, 7.3rem);
      font-weight: 950;
      line-height: 0.92;
      letter-spacing: 0.045em;
      text-transform: uppercase;
      color: white;
      text-shadow:
        0 0 8px rgba(255,255,255,0.82),
        0 0 22px rgba(89,184,255,0.72),
        0 0 42px rgba(155,92,255,0.66),
        0 0 66px rgba(255,79,216,0.42);
      animation:
        flip 6s cubic-bezier(.55,.05,.45,.95) infinite,
        neon-cycle 6s linear infinite;
      backface-visibility: visible;
    }

    .subtitle {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      line-height: 1.65;
      letter-spacing: 0.04em;
    }

    .penny-line {
      margin: 8px 0 0;
      color: #fff;
      font-size: clamp(0.78rem, 1.6vw, 0.98rem);
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-shadow:
        0 0 14px rgba(255,79,216,0.7),
        0 0 24px rgba(89,184,255,0.38);
    }

    .spark {
      color: var(--pink);
      text-shadow: 0 0 16px currentColor;
    }

    @keyframes flip {
      0%, 14%   { transform: rotateX(0deg) rotateY(0deg) scale(1); }
      38%       { transform: rotateX(0deg) rotateY(180deg) scale(0.94); }
      50%, 64%  { transform: rotateX(0deg) rotateY(360deg) scale(1); }
      88%       { transform: rotateX(180deg) rotateY(360deg) scale(0.94); }
      100%      { transform: rotateX(360deg) rotateY(360deg) scale(1); }
    }

    @keyframes neon-cycle {
      0%, 100% {
        text-shadow:
          0 0 8px rgba(255,255,255,0.82),
          0 0 22px rgba(155,92,255,0.76),
          0 0 42px rgba(89,184,255,0.60),
          0 0 66px rgba(255,79,216,0.42);
      }
      50% {
        text-shadow:
          0 0 8px rgba(255,255,255,0.82),
          0 0 22px rgba(255,79,216,0.72),
          0 0 42px rgba(89,184,255,0.72),
          0 0 66px rgba(155,92,255,0.46);
      }
    }

    @keyframes shimmer {
      to { background-position: 260% 0; }
    }

    @keyframes ambient-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.98); opacity: 0.82; }
      50% { transform: scale(1.03); opacity: 1; }
    }

    @media (max-width: 560px) {
      .stage { min-height: 88svh; padding-inline: 18px; }
      .rotator { height: 96px; }
      .logo { letter-spacing: 0.12em; }
      .subtitle { max-width: 34ch; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .rotating-text {
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-labelledby="comingSoon">
    <div class="orb" aria-hidden="true"></div>

    <section class="content">
      <p class="eyebrow">WildCard DEV // Experimental Division</p>
      <h1 class="logo">WildCard Labs</h1>

      <div class="rotator" aria-hidden="true">
        <p class="rotating-text">Coming Soon</p>
      </div>

      <p id="comingSoon" class="subtitle">
        Penny is in the lab turning questionable ideas into suspiciously functional technology.
      </p>

      <p class="penny-line">
        <span class="spark">✦</span>
        Please keep all hands clear of the prototype.
        <span class="spark">✦</span>
      </p>
    </section>
  </main>
</body>
</html>
